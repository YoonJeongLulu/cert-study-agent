[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cert-study-agent"
version = "0.1.0"
description = "Adaptive multi-exam Telegram study agent"
requires-python = ">=3.9"

[project.optional-dependencies]
test = ["pytest>=7,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
